[package]
name = "neural-network-scratch"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.17.2", features = ["serde"] }
rand = "0.9.2"
ndarray-rand = "0.16.0"
serde = { version = "1.0.130", features = ["derive"] }
serde_derive = "1.0.130"
bincode = "1.3.3"
# hill_descent_lib genetic algorithm for gradient-free training
hill_descent_lib = "0.3.1"
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
debug = true

[[bench]]
name = "genetic_training"
harness = false

[features]
dhat = ["dep:dhat"]
